project_number: 6
title: "Stimulus-to-Response GLM"
subtitle: "Construct and analyze a neural encoding design matrix, estimate response weights, test interpretable contrasts, and explain residual structure under controlled noise and confounding"
difficulty: high
workshop_concepts:
  - vectors, matrices, and matrix multiplication
  - linear regression and the general linear model
  - design matrices and least-squares estimation
  - omitted-variable bias (derived via basic linear algebra)
  - residuals and residual diagnostics (autocorrelation)
  - contrasts, t-tests, and nested-model F-tests / links to ANOVA
  - probability (expectation of the OLS estimator under a misspecified model)
estimated_hours_per_group: "6-8 person-hours across a 4-6 person group (approximately one workshop day)"
group_size: "4-6 (roles adapt down to 4, see student handout Section 6)"
data_origin: "Synthetic, generated from a GLM with a real, moderate confound between a contrast regressor and an omitted session-time drift term; see shared/src/generate_data.py"
random_seed: 20260928
python_version: "3.12 (developed and tested); should work on any Python >= 3.10 with the pinned dependency floors"
package_version: "1.0.0"
true_effects:
  beta0: 5.0
  beta_45: 1.2
  beta_90: 3.5
  beta_135: 0.5
  beta_contrast: 2.0
  sigma_noise: 1.5
true_drift_params:
  d_lin: -3.0
  d_quad: 2.0
  d_sin: 1.5
  d_cos: -1.0
n_trials: 600
n_holdout: 90
holdout_fraction: 0.15
