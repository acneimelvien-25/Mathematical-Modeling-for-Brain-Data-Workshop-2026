project_number: 3
title: "Representational Geometry"
subtitle: "Use linear algebra to discover how structured stimuli are represented by a neural population, compare PCA-based representations, and build a mathematically justified low-dimensional decoder"
difficulty: high
workshop_concepts:
  - vectors and matrices as data representations
  - covariance matrices and their eigendecomposition
  - principal component analysis (PCA)
  - variance explained and linear vs. intrinsic dimensionality
  - distances and similarity (representational similarity analysis)
  - ordinary least-squares regression as a decoder
  - cross-validation and the bias-variance trade-off
  - bootstrap resampling and uncertainty quantification
  - Poisson-distributed spike counts
estimated_hours_per_group: "6-8 person-hours across a 4-6 person group (approximately one workshop day)"
group_size: "4-6 (roles adapt down to 4, see student handout Section 6)"
data_origin: "Synthetic, generated from a population of independently Gaussian-bump-tuned neurons over a 2-D stimulus feature space; see shared/src/generate_data.py"
random_seed: 20260925
python_version: "3.12 (developed and tested); should work on any Python >= 3.10 with the pinned dependency floors"
package_version: "1.0.0"
n_neurons: 80
grid_side: 8
n_fit_stimuli: 52
n_holdout_stimuli: 12
true_stimulus_dimensionality: 2
reference_n_components_for_90pct_variance: 6
