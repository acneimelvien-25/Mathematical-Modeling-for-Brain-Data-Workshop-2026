project_number: 1
title: "Membrane to Spike"
subtitle: "Infer and stress-test a leaky integrate-and-fire model against a hidden Hodgkin-Huxley-style reference neuron"
difficulty: high
workshop_concepts:
  - single-neuron models (leaky integrate-and-fire; Hodgkin-Huxley as hidden reference)
  - first-order ODEs and their closed-form solutions
  - numerical vs. analytical stability of estimation methods
  - linear regression / design matrices (steady-state vs. current)
  - nonlinear least squares (onset-transient fitting)
  - probability and noise (input-current noise, observation noise, spike-count variability)
  - bootstrap resampling and uncertainty quantification
  - parameter identifiability
  - model validation and model limitations
estimated_hours_per_group: "6-8 person-hours across a 4-6 person group (approximately one workshop day)"
group_size: "4-6 (roles adapt down to 4, see student handout Section 6)"
data_origin: "Synthetic, generated from a classic Hodgkin-Huxley (1952) squid giant axon model; see shared/src/generate_data.py"
random_seed: 20260923
python_version: "3.12 (developed and tested); should work on any Python >= 3.10 with the pinned dependency floors"
package_version: "1.0.0"
fit_conditions_uA_per_cm2: [0.0, 1.0, 1.7, 8.0, 14.0]
holdout_conditions_uA_per_cm2: [4.0, 6.0]
